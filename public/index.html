<script>
/* 주소 ?c=나라&l=언어 — 나라 데이터 파일 하나를 classic script 로 붙인다(file:// 에서도 동작) */
(function(){var h=document.documentElement,c='tj',l='',m=false;
try{var q=new URLSearchParams(location.search);c=(q.get('c')||'tj').toLowerCase();l=(q.get('l')||'').toLowerCase();}catch(e){}
if(!/^[a-z]{2}$/.test(c))c='tj';if(!/^[a-z]{2}$/.test(l))l='';window.CAEDU_REQ={c:c,l:l};
h.className+=' js';try{var t=localStorage.getItem('caedu-theme');if(t==='mono'||t==='key')h.setAttribute('data-theme',t);}catch(e){}
try{m=matchMedia('(prefers-reduced-motion: reduce)').matches||!!(navigator.connection&&navigator.connection.saveData);}catch(e){}
h.className+=m?' still':' motion';
document.write('<script src="data/'+c+'.js"><\/script>');})();
</script>

<script>
/* 틀 파일에는 언어·나라 색을 박지 않는다: 나라 데이터의 키 색(colors)을 html 에 CSS 변수로 얹고(첫 그림 전 — 색 번쩍임 0),
   열린 언어·기본 언어로 html lang 과 제목을 본문 전에 정한다(없으면 무채 대체색·ru 그대로) */
(function(){var q=window.CAEDU_REQ||{},A=window.CAEDU||{},C=A.country&&A.country[q.c],h=document.documentElement;
var K=C&&C.colors,V={key:'--key',keyOnInk:'--key-on-ink',keyOnInkLg:'--key-on-ink-lg',keyRipe:'--key-ripe'};
if(K)for(var k in V)if(/^#[0-9a-f]{6}$/i.test(K[k]||''))h.style.setProperty(V[k],K[k]);
if(!C||!A.lang||!A.lang.ru)return;
var ok=function(l){return !!l&&C.open.indexOf(l)>=0&&(l==='ru'||!!(C.copy&&C.copy[l]));};
var l=ok(q.l)?q.l:(ok(C.defaultLang)?C.defaultLang:'ru'),P=l==='ru'?A.lang.ru:C.copy[l];
if(P&&P.meta&&P.meta.code)document.documentElement.lang=P.meta.code;if(P&&P.t&&P.t['doc.title'])document.title=P.t['doc.title'];})();
</script>
